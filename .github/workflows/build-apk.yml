name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Optionnel : signature stable (voir README). Sans secrets, l'APK est signé avec une clé de debug.
      - name: Préparer la clé de signature (si fournie)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Compiler l'APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ecowidget-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # APK directement téléchargeable (sans zip) : release « latest » mise à jour à chaque build.
      - name: Publier l'APK (release « latest »)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Ecowidget.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Ecowidget.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Dernière version" \
            --notes "Build du $(date -u +'%d/%m/%Y %H:%M') UTC, commit ${GITHUB_SHA::7}."
